<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Díptero estilizado</title>
  <desc id="desc">Marca circular com mosca estilizada para a Chave de Identificação de Insetos</desc>

  <defs>
    <linearGradient id="badgeGradient" x1="22" y1="16" x2="138" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8faf8"/>
      <stop offset="0.55" stop-color="#eef7f3"/>
      <stop offset="1" stop-color="#dbece7"/>
    </linearGradient>

    <linearGradient id="bodyGradient" x1="78" y1="44" x2="82" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173946"/>
      <stop offset="0.48" stop-color="#1f4e5f"/>
      <stop offset="1" stop-color="#2f855a"/>
    </linearGradient>

    <linearGradient id="wingGradient" x1="34" y1="43" x2="126" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.54" stop-color="#c7e8f4" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#8ec9dd" stop-opacity="0.58"/>
    </linearGradient>

    <filter id="softShadow" x="-16" y="-10" width="192" height="188" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#102027" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <circle cx="80" cy="80" r="68" fill="url(#badgeGradient)" stroke="#1f4e5f" stroke-width="4"/>
    <circle cx="80" cy="80" r="55" fill="none" stroke="#b7d8d0" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
  </g>

  <g transform="translate(80 82)">
    <!-- asas membranosas, um par funcional típico de Diptera -->
    <path d="M -12 -19 C -43 -47 -73 -41 -78 -11 C -82 13 -58 25 -31 18 C -16 14 -6 3 -1 -9"
          fill="url(#wingGradient)" stroke="#1f4e5f" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 12 -19 C 43 -47 73 -41 78 -11 C 82 13 58 25 31 18 C 16 14 6 3 1 -9"
          fill="url(#wingGradient)" stroke="#1f4e5f" stroke-width="2.2" stroke-linejoin="round"/>

    <path d="M -62 -15 C -47 -9 -33 -5 -17 -5" stroke="#6aaabd" stroke-width="1.5" stroke-linecap="round" opacity="0.72"/>
    <path d="M -58 5 C -41 5 -28 1 -12 -8" stroke="#6aaabd" stroke-width="1.4" stroke-linecap="round" opacity="0.58"/>
    <path d="M 62 -15 C 47 -9 33 -5 17 -5" stroke="#6aaabd" stroke-width="1.5" stroke-linecap="round" opacity="0.72"/>
    <path d="M 58 5 C 41 5 28 1 12 -8" stroke="#6aaabd" stroke-width="1.4" stroke-linecap="round" opacity="0.58"/>

    <!-- halteres -->
    <path d="M -17 9 C -35 24 -42 33 -47 45" stroke="#1f4e5f" stroke-width="2.7" fill="none" stroke-linecap="round"/>
    <circle cx="-49" cy="49" r="5" fill="#2f855a" stroke="#173946" stroke-width="2"/>
    <path d="M 17 9 C 35 24 42 33 47 45" stroke="#1f4e5f" stroke-width="2.7" fill="none" stroke-linecap="round"/>
    <circle cx="49" cy="49" r="5" fill="#2f855a" stroke="#173946" stroke-width="2"/>

    <!-- pernas -->
    <path d="M -16 -2 L -36 8 L -47 21" stroke="#173946" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -16 11 L -39 20 L -55 35" stroke="#173946" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -12 25 L -28 43 L -35 58" stroke="#173946" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 16 -2 L 36 8 L 47 21" stroke="#173946" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 16 11 L 39 20 L 55 35" stroke="#173946" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 12 25 L 28 43 L 35 58" stroke="#173946" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- corpo -->
    <ellipse cx="0" cy="-34" rx="13" ry="12" fill="#173946"/>
    <ellipse cx="-5" cy="-36" rx="4.5" ry="5" fill="#79c7d7" opacity="0.9"/>
    <ellipse cx="5" cy="-36" rx="4.5" ry="5" fill="#79c7d7" opacity="0.9"/>
    <path d="M -7 -45 C -19 -54 -29 -54 -38 -47" stroke="#173946" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 7 -45 C 19 -54 29 -54 38 -47" stroke="#173946" stroke-width="3" fill="none" stroke-linecap="round"/>

    <ellipse cx="0" cy="-15" rx="16" ry="18" fill="url(#bodyGradient)" stroke="#102027" stroke-width="2"/>
    <path d="M 0 -31 C 5 -21 5 -9 0 4 C -5 -9 -5 -21 0 -31Z" fill="#d8f3ea" opacity="0.25"/>

    <path d="M -14 1 C -19 23 -10 43 0 53 C 10 43 19 23 14 1 C 9 6 -9 6 -14 1Z"
          fill="url(#bodyGradient)" stroke="#102027" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M -11 14 C -4 18 4 18 11 14" stroke="#b7d8d0" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
    <path d="M -9 27 C -3 31 3 31 9 27" stroke="#b7d8d0" stroke-width="2" stroke-linecap="round" opacity="0.64"/>
    <path d="M -5 40 C -2 42 2 42 5 40" stroke="#b7d8d0" stroke-width="2" stroke-linecap="round" opacity="0.56"/>
  </g>
</svg>
